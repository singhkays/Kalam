name: Deploy Kalam landing page to singhkays.github.io

on:
  push:
    branches: [ main ]
    paths:
      - 'landing-page/**'
      - '.github/workflows/deploy-kalam-landing.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: landing-page

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev || true
        working-directory: landing-page

      - name: Build landing page
        run: npm run build
        working-directory: landing-page

      - name: Deploy to singhkays.github.io
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Use credential helper to avoid leaking PAT in logs/URL history.
          # NOTE: store format is URL lines (https://user:pass@host), not
          # git-credential key-value blocks — the latter breaks the push.
          git config --global credential.helper 'store'
          printf "https://x-access-token:%s@github.com\n" "$PAGES_PAT" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git clone https://github.com/singhkays/singhkays.github.io.git out
          cd out
          git checkout gh-pages || git checkout -b gh-pages
          rm -rf kalam
          mkdir -p kalam
          cp -R ../landing-page/dist/* kalam/
          echo "singhkays.com" > CNAME
          git add kalam CNAME
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Kalam landing page"
            git push origin gh-pages
          else
            echo "No changes to deploy"
          fi
          rm -f ~/.git-credentials
